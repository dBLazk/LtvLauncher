name: Build CleanTV APK

# Run manually: Actions tab -> "Build CleanTV APK" -> Run workflow.
# The signed APK appears at the bottom of the run page under "Artifacts".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Generate database migrations schema
        run: flutter pub run drift_dev schema generate drift_schemas/ test/generated_migrations/

      # A personal signing key, created once and kept in the Actions cache so later
      # builds can install over earlier ones. If the cache is ever evicted, a new
      # key is made and you must uninstall the old CleanTV app before installing.
      - name: Restore signing key
        id: key
        uses: actions/cache@v4
        with:
          path: android/my-release-key.jks
          key: cleantv-signing-key-v1

      - name: Create signing key (first run only)
        if: steps.key.outputs.cache-hit != 'true'
        run: >
          keytool -genkeypair -v
          -keystore android/my-release-key.jks
          -alias cleantv -keyalg RSA -keysize 2048 -validity 10000
          -storepass cleantv-local -keypass cleantv-local
          -dname "CN=CleanTV, O=Personal"

      - name: Build release APK
        env:
          KEYSTORE_FILE: "../my-release-key.jks"
          KEYSTORE_PASSWORD: cleantv-local
          KEY_ALIAS: cleantv
          KEY_PASSWORD: cleantv-local
        run: flutter build apk --release --target-platform=android-arm,android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanTV-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
